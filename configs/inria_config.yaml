# INRIA Dataset Configuration
dataset:
  name: "INRIA"
  tile_size: 5000
  num_classes: 2
  color_list: [[0, 0, 0], [255, 255, 255]]
  color_names: ["Background", "Building"]
  train_img_dir: "../train_dir/inria_aerials/"
  train_mask_dir: "../train_dir/inria_masks/"
  val_img_dir: "../validation_dir/inria_aerials/"
  val_mask_dir: "../validation_dir/inria_masks/"

model:
  input_shape: [256, 256, 3]
  filters: 32
  n_block: 4
  bottleneck_mode: "serial"
  residual: true

training:
  batch_size: 50
  epochs: 50
  learning_rate: 0.0001
  optimizer: "sgd"
  loss: "sparse_categorical_crossentropy"
  patch_size: 256
  patch_stride: 256

inference:
  batch_size: 50
  use_tta: true
